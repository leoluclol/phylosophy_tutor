# Philosophy Tutor — V1 configuration
# API keys live in `.env` (copy from `.env.example`), never here.

llm:
  provider: openrouter          # only supported provider for V1
  base_url: https://openrouter.ai/api/v1/chat/completions
  api_key_env: OPENROUTER_API_KEY
  researcher:
    model: openai/gpt-5.4-mini
    temperature: 0.3
    max_tokens: 16000
  critic:
    model: openai/gpt-5.4-mini
    temperature: 0.2
    max_tokens: 12000
  writer:
    model: openai/gpt-5.4-mini
    temperature: 0.6
    max_tokens: 16000
  max_json_retries: 2           # extra attempts to repair invalid JSON
  max_writer_attempts: 2        # self-correction attempts for writer integrity

search:
  enabled: true
  provider: duckduckgo          # duckduckgo | bing | multi
  providers: [duckduckgo, bing] # used when provider == multi
  max_results: 10               # results per query
  max_fetch: 8                  # maximum pages fetched per lesson
  max_page_chars: 20000         # chars of page text shown to the LLM
  fetch_timeout: 25
  max_material_chars: 150000    # hard cap on material passed to the researcher

curriculum:
  file: curriculum/property.yaml
  month: property

generation:
  output_dir: lessons
  cache_dir: .cache

logging:
  level: INFO
  format: "%(message)s"
