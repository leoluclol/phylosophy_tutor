      fundamental_question: "Essere proprietari di sé stessi implica necessariamente essere proprietari dei propri beni?"
      why_it_matters: >-
        Cohen separa l'autoproprietà dalla proprietà delle risorse esterne: si può
        essere a favore della prima senza accettare la seconda. È la mossa chiave
        che definisce il confronto tra libertarismo ed egualitarismo di sinistra.
      objectives:
        - Separare self-ownership da ownership of external resources.
        - Capire l'argomento di Cohen contro il passaggio "autoproprietà → proprietà di tutto".
        - Vedere perché il dibattito non si chiude.
