      fundamental_question: "La tassazione redistributiva è compatibile con l'autoproprietà?"
      why_it_matters: >-
        Per Nozick tassare il reddito da lavoro equivale a lavoro forzato. È una
        delle tesi più discusse della filosofia politica contemporanea: la
        lezione la espone e la mette alla prova.
      objectives:
        - Esporre la tesi "tassazione = lavoro forzato".
        - Presentare le obiezioni principali (Murphy e Nagel, egalitaristi, chi distingue imposizione da estorsione).
        - Discutere chi abbia ragione senza decidere.
