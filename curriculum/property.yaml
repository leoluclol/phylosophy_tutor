        come una distribuzione è arrivata a essere. L'appropriazione lockeana
        (ripulita) e il trasferimento volontario bastano.
      objectives:
        - Studiare justice in acquisition, self-ownership, historical entitlement.
        - Comprendere la struttura di 'distributive justice secondo i principi storici'.
