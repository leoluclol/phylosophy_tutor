# =============================================================================
# Philosophy Tutor — Month 1: "Che cosa possiamo possedere?"
#
# La proprietà privata: che cosa significa possedere qualcosa, perché dovrebbe
# esistere un diritto di proprietà, quali sono i suoi limiti e quali argomenti
# esistono contro di essa.
#
# Il mese NON cerca di convincere lo studente a favore o contro la proprietà
# privata: mette davanti ai migliori argomenti disponibili, da prospettive
# diverse, senza strawman e senza dichiarare un "vincitore".
#
# Convenzioni:
#   * known_primary_sources: fonti PRIMARIE già note (testi degli autori).
#       url può essere vuota quando il testo è protetto da copyright: in quel
#       caso il researcher NON deve inventare un URL, ma dichiarare la fonte
#       senza link verificato.
#   * known_secondary_sources: analisi accademica affidabile (SEP/IEP/università).
#   * suggested_queries: query di partenza, in inglese (migliori risultati).
#   * requirements: vincoli specifici della lezione per researcher/critic/writer.
# =============================================================================

month:
  id: property
  title: "Che cosa possiamo possedere?"
  theme: >-
    La proprietà privata: che cosa significa possedere qualcosa, perché
    dovrebbe esistere un diritto di proprietà, quali sono i suoi limiti e
    quali argomenti esistono contro di essa.
  first_day_question: "Che cosa possiamo possedere?"

  days:
  # -----------------------------------------------------------------------
    # Giorno 1 — Il concetto stesso di proprietà
    # -----------------------------------------------------------------------
    - day: 1
      title: "Che cosa significa possedere qualcosa?"
      fundamental_question: "Che cosa significa dire 'questa cosa è mia'?"
      why_it_matters: >-
        Prima di discutere se la proprietà sia giusta, bisogna capire di che
        cosa stiamo parlando. "Proprietà" oggi viene usata per indicare oggetti,
        diritti, idee, persino parti di persone. Questa lezione distingue i
        concetti che rendono la nozione utilizzabile.
      objectives:
        - Distinguere possesso, uso, controllo, proprietà, diritto, esclusione e custodia.
        - Capire che la proprietà non è un mero fatto materiale, ma un insieme di relazioni giuridiche e normative.
        - Introdurre l'idea che "proprietà" possa essere scomposta in diritti distinti.
      concepts:
        - possession
        - use
        - control
        - ownership
        - right
        - exclusion
        - custody
      authors:
        - John Locke
        - Jeremy Bentham
      known_primary_sources:
        - author: "John Locke"
          title: "Second Treatise of Government"
          location: "Book II, Ch. V 'Of Property' (§§ 25–51)"
          url: "https://www.gutenberg.org/files/7370/7370-h/7370-h.htm"
          note: "Testo completo in HTML (Project Gutenberg)."
      known_secondary_sources:
        - author: "Christopher Morris (ed.)"
          title: "Property, Stanford Encyclopedia of Philosophy"
          url: "https://plato.stanford.edu/entries/property/"
          note: "Definizioni di proprietà e bundle of rights."
      suggested_queries:
        - "what is property definition ownership possession control Stanford Encyclopedia"
        - "Locke Second Treatise Of Property chapter 5 full text"
        - "Hohfeld property as bundle of rights possession vs ownership"
      requirements: >-
        La lezione deve distinguere accuratamente possesso, uso, controllo,
        proprietà, diritto, esclusione e custodia, e mostrare che "proprietà"
        non è un fatto materiale ma una relazione normativa.

    # -----------------------------------------------------------------------
    # Giorno 2 — Perché dovrebbe esistere la proprietà?
    # -----------------------------------------------------------------------
    - day: 2
      title: "Perché dovrebbe esistere la proprietà?"
      fundamental_question: "Perché una persona dovrebbe avere il diritto di escludere gli altri dall'uso di una risorsa?"
      why_it_matters: >-
        La proprietà è un diritto di esclusione: dà a qualcuno il potere di
        tenere altri lontani da una risorsa. Va giustificato. Questa lezione
        introduce le famiglie principali di giustificazione.
      objectives:
        - Introdurre i principali tipi di giustificazione della proprietà.
        - Capire la differenza tra giustificazioni che partono dalla natura e giustificazioni che partono dalle conseguenze.
        - Preparare il terreno per le lezioni dedicate a Locke, Marx, Nozick, Rawls, Cohen.
      concepts:
        - natural justification
        - utilitarian justification
        - libertarian justification
        - conventional justification
        - consequentialist justification
        - exclusion
      authors:
        - John Locke
        - David Hume
        - Jeremy Bentham
      known_primary_sources:
        - author: "John Locke"
          title: "Second Treatise of Government"
          location: "Book II, Ch. V, § 27 (labour as source of property)"
          url: "https://www.gutenberg.org/files/7370/7370-h/7370-h.htm"
          note: ""
      known_secondary_sources:
        - author: "Christopher Morris (ed.)"
          title: "Property, Stanford Encyclopedia of Philosophy"
          url: "https://plato.stanford.edu/entries/property/"
          note: "Sezione sulle giustificazioni."
      suggested_queries:
        - "justification of private property natural rights utility convention"
        - "Locke labour theory of property justification"
        - "Hume conventions of property justice"
      requirements: >-
        Presentare bene TUTTE le famiglie di giustificazione (naturale,
        utilitarista, libertaria, convenzionale, consequenzialista) senza
        presentarne una come ovviamente superiore.

    # -----------------------------------------------------------------------
    # Giorno 3 — Locke: il problema dell'appropriazione
    # -----------------------------------------------------------------------
    - day: 3
      title: "Locke: il problema dell'appropriazione"
      fundamental_question: "Come può diventare 'mio' qualcosa che inizialmente appartiene al mondo comune?"
      why_it_matters: >-
        Locke è il punto di partenza della riflessione moderna sulla proprietà.
        Il suo problema è il più difficile: spiegare come una risorsa comune
        possa diventare proprietà privata senza il consenso di tutti.
      objectives:
        - Leggere il passaggio lockeano chiave (Second Treatise, Ch. V).
        - Comprendere common, labour, appropriation, mixing one's labour, spoilage, sufficiency proviso.
        - Vedere che l'argomento di Locke ha una struttura precisa che si può criticare pezzo per pezzo.
      concepts:
        - common
        - labour
        - appropriation
        - mixing one's labour
        - spoilage limitation
        - sufficiency proviso
      authors:
        - John Locke
      known_primary_sources:
        - author: "John Locke"
          title: "Second Treatise of Government"
          location: "Book II, Ch. V, 'Of Property' (§§ 25–51)"
          url: "https://www.gutenberg.org/files/7370/7370-h/7370-h.htm"
          note: "Testo completo in HTML."
      known_secondary_sources:
        - author: "Christopher Morris (ed.)"
          title: "Property, Stanford Encyclopedia of Philosophy"
          url: "https://plato.stanford.edu/entries/property/"
          note: ""
        - author: "Alexander Moseley"
          title: "John Locke: Political Philosophy (Internet Encyclopedia of Philosophy)"
          url: "https://iep.utm.edu/locke-po/"
          note: ""
      suggested_queries:
        - "Locke Second Treatise chapter 5 Of Property labour mixing"
        - "Locke sufficiency proviso spoilage appropriation"
        - "Locke appropriation without consent common world"
      requirements: >-
        Citare almeno un passaggio di Ch. V ed esporre i tre limiti lockeani:
        labour, spoilage, proviso. Non trasformare l'argomento in un riassunto
        privo del testo.

    # -----------------------------------------------------------------------
    # Giorno 4 — Il lavoro crea davvero proprietà?
    # -----------------------------------------------------------------------
    - day: 4
      title: "Il lavoro crea davvero proprietà?"
      fundamental_question: "Perché il mio lavoro dovrebbe trasferire un diritto su una cosa?"
      why_it_matters: >-
        L'argomento di Locke afferma che il lavoro genera proprietà. Ma "lavoro"
        e "diritto" sono categorie diverse: occorre spiegare il passaggio, non
        darlo per scontato.
      objectives:
        - Esaminare criticamente l'argomento lockeano.
        - Distinguere lavorare su una cosa, trasformarla, crearne valore e acquisire un diritto.
        - Prendere sul serio sia la difesa sia l'attacco.
      concepts:
        - labour
        - transformation
        - value creation
        - acquisition
        - desert
      authors:
        - John Locke
        - Jeremy Waldron
        - Robert Nozick
      known_primary_sources:
        - author: "John Locke"
          title: "Second Treatise of Government"
          location: "Book II, Ch. V, §§ 27–28"
          url: "https://www.gutenberg.org/files/7370/7370-h/7370-h.htm"
          note: ""
      known_secondary_sources:
        - author: "Christopher Morris (ed.)"
          title: "Property, Stanford Encyclopedia of Philosophy"
          url: "https://plato.stanford.edu/entries/property/"
          note: "Sezione 'Locke' e critiche."
      suggested_queries:
        - "Locke labour mixing argument criticism Wenar"
        - "why should labour create property right"
        - "Locke property labour Nozick criticism"
      requirements: >-
        Esaminare il passaggio da lavoro a diritto senza dare per scontato che
        sia valido; presentare le obiezioni serie e le difese lockeane.

    # -----------------------------------------------------------------------
    # Giorno 5 — Il problema del "mixing labour"
    # -----------------------------------------------------------------------
    - day: 5
      title: "Il problema del 'mixing labour'"
      fundamental_question: "Se mescolo qualcosa che è mio con qualcosa che non è mio, perché dovrei diventare proprietario dell'intero risultato?"
      why_it_matters: >-
        È l'illustrazione più famosa del punto debole dell'argomento lockeano.
        Mescolare due cose di cui possiedi solo una non dà evidentemente
        un diritto sull'insieme.
      objectives:
        - Ricostruire l'argomento del mixing.
        - Presentare le critiche principali (Nozick, Waldron, Simmons, Wenar).
        - Presentare le migliori risposte disponibili per Locke.
      concepts:
        - mixing labour
        - tomato soup argument
        - ownership of results
        - boundary problem
      authors:
        - John Locke
        - Robert Nozick
        - Jeremy Waldron
        - A. John Simmons
      known_primary_sources:
        - author: "John Locke"
          title: "Second Treatise of Government"
          location: "Book II, Ch. V, § 27"
          url: "https://www.gutenberg.org/files/7370/7370-h/7370-h.htm"
          note: "Passaggio sul 'mixing his labour'."
      known_secondary_sources:
        - author: "Christopher Morris (ed.)"
          title: "Property, Stanford Encyclopedia of Philosophy"
          url: "https://plato.stanford.edu/entries/property/"
          note: ""
      suggested_queries:
        - "Locke mixing labour argument tomato soup analogy"
        - "Nozick critic of Locke mixing labour 1974"
        - "Waldron Locke mixing labour objection"
      requirements: >-
        Presentare la formulazione migliore del mixing, l'obiezione classica, le
        risposte disponibili e ciò che resta dubbio.

    # -----------------------------------------------------------------------
    # Giorno 6 — Il limite dello spoilage
    # -----------------------------------------------------------------------
    - day: 6
      title: "Il limite dello spoilage"
      fundamental_question: "Perché il mio lavoro dovrebbe trasferire un diritto su una cosa?"
      why_it_matters: >-
        Locke non ammette l'appropriazione senza limiti: non si può prendere più
        di quanto si possa usare prima che vada a male. Questo limite contiene
        una logica morale profonda, ma porta con sé problemi seri.
      objectives:
        - Capire perché Locke introduce il limite dello spoilage.
        - Vedere quali problemi genera (misura, giustizia distributiva, moneta).
        - Preparare la discussione del ruolo del denaro (giorno 8).
      concepts:
        - spoilage limitation
        - waste
        - non-perishable
        - accumulation
        - money
      authors:
        - John Locke
      known_primary_sources:
        - author: "John Locke"
          title: "Second Treatise of Government"
          location: "Book II, Ch. V, § 31"
          url: "https://www.gutenberg.org/files/7370/7370-h/7370-h.htm"
          note: "Passaggio sul divieto di sprecati."
      known_secondary_sources:
        - author: "Christopher Morris (ed.)"
          title: "Property, Stanford Encyclopedia of Philosophy"
          url: "https://plato.stanford.edu/entries/property/"
          note: ""
      suggested_queries:
        - "Locke spoilage limitation property chapter 5"
        - "Locke no waste proviso property"
        - "Locke appropriation limits money spoilage"
      requirements: >-
        Spiegare perché il limite esiste, quali problemi genera e come si collega
        alla questione della moneta. Objections and replies, senza decretare.

    # -----------------------------------------------------------------------
    # Giorno 7 — Il corpo umano: possiamo possedere noi stessi?
    # -----------------------------------------------------------------------
    - day: 7
      title: "Il corpo umano: possiamo possedere noi stessi?"
      fundamental_question: "Siamo proprietari del nostro corpo al punto da poterne vendere le parti?"
      why_it_matters: >-
        Lasciamo da parte i campi. Se la proprietà è il diritto di controllare 
        e alienare una risorsa, questo si applica al nostro corpo biologico? 
        La vendita di organi, il plasma o i brevetti su sequenze di DNA ci costringono 
        a chiederci se il corpo sia una "cosa" che possediamo.
      objectives:
        - Esplorare l'autoproprietà (self-ownership) applicata al corpo fisico.
        - Discutere i limiti etici alla mercificazione (commodification).
        - Analizzare il famoso caso legale Moore v. Regents of the University of California.
      concepts:
        - self-ownership
        - commodification
        - bodily autonomy
        - inalienability
      authors:
        - Debra Satz
        - Michael Sandel
      known_primary_sources:
        - author: "Supreme Court of California"
          title: "Moore v. Regents of the University of California"
          location: "Sentenza (1990) sui diritti di proprietà sulle cellule derivate"
          url: "https://law.justia.com/cases/california/supreme-court/3d/51/120.html"
          note: "Decisione legale storica, fondamentale per la bioetica della proprietà."
      known_secondary_sources:
        - author: "Stephen Wilkinson"
          title: "The Sale of Human Organs, Stanford Encyclopedia of Philosophy"
          url: "https://plato.stanford.edu/entries/organs-sale/"
          note: "Panoramica etica sulla vendita del corpo."
      suggested_queries:
        - "Moore v Regents property rights over cells"
        - "commodification of the human body philosophy"
        - "Debra Satz why some things should not be for sale"
      requirements: >-
        Spostare il focus dalle risorse esterne al corpo umano. Non dare per scontato 
        che l'autoproprietà implichi automaticamente il diritto di vendere pezzi di sé.

    # -----------------------------------------------------------------------
    # Giorno 8 — La frontiera spaziale: chi possiede l'universo?
    # -----------------------------------------------------------------------
    - day: 8
      title: "La frontiera spaziale: chi possiede l'universo?"
      fundamental_question: "Si possono rivendicare diritti di proprietà su corpi celesti e risorse extraterrestri?"
      why_it_matters: >-
        Con l'avvento della space economy privata (estrazione mineraria da asteroidi, 
        basi lunari), l'appropriazione originaria non è più un esperimento mentale, 
        ma un problema geopolitico, giuridico ed economico immediato.
      objectives:
        - Applicare le teorie dell'appropriazione a un dominio extra-terrestre.
        - Analizzare l'Outer Space Treaty (1967) e il divieto di appropriazione sovrana.
        - Esplorare il conflitto tra "common heritage of mankind" e lo sfruttamento commerciale.
      concepts:
        - space law
        - terra nullius
        - res communis
        - common heritage of mankind
        - original acquisition
      authors:
        - Hugo Grotius (analogia con le acque internazionali)
        - Elinor Ostrom (estensioni ai global commons)
      known_primary_sources:
        - author: "United Nations"
          title: "Outer Space Treaty"
          location: "Articoli I e II (Non-appropriation principle)"
          url: "https://www.unoosa.org/oosa/en/ourwork/spacelaw/treaties/outerspacetreaty.html"
          note: "Trattato del 1967 che regola la giurisdizione e la proprietà nello spazio."
      known_secondary_sources:
        - author: "James Schwartz"
          title: "The Value of Science in Space Exploration"
          url: ""
          note: "Analisi sull'etica dell'esplorazione e dell'estrazione spaziale."
      suggested_queries:
        - "space property rights asteroid mining ethics"
        - "Outer Space Treaty non-appropriation principle"
        - "common heritage of mankind space law philosophy"
      requirements: >-
        Evitare di trattare il tema come pura fantascienza: ancorarlo ai trattati 
        internazionali esistenti e alle attuali dispute legali sull'estrazione commerciale.

    # -----------------------------------------------------------------------
    # Giorno 9 — La natura può possedere se stessa?
    # -----------------------------------------------------------------------
    - day: 9
      title: "La natura può possedere se stessa?"
      fundamental_question: "Un ecosistema, un fiume o una foresta possono essere legalmente considerati proprietari di se stessi?"
      why_it_matters: >-
        La filosofia occidentale vede la natura esclusivamente come 'oggetto' di proprietà. 
        Tuttavia, prospettive ecocentriche e visioni del mondo indigene stanno spingendo 
        i tribunali a riconoscere enti naturali come soggetti titolari di diritti e di proprietà.
      objectives:
        - Mettere in discussione l'antropocentrismo del concetto di proprietà.
        - Studiare i casi reali in cui entità naturali hanno ottenuto 'legal personhood' (es. il fiume Whanganui).
        - Confrontare il diritto di proprietà occidentale con i modelli di 'stewardship' indigeni.
      concepts:
        - legal personhood for nature
        - indigenous stewardship
        - anthropocentrism
        - ecocentrism
        - self-owning ecosystems
      authors:
        - Christopher D. Stone
        - Cormac Cullinan
      known_primary_sources:
        - author: "Christopher D. Stone"
          title: "Should Trees Have Standing? - Toward Legal Rights for Natural Objects"
          location: "Southern California Law Review (1972)"
          url: ""
          note: "Testo fondativo per i diritti legali della natura."
      known_secondary_sources:
        - author: "David Takacs"
          title: "The Historical Roots of Rights of Nature"
          url: ""
          note: "Approfondimento sulle origini del movimento per i diritti della natura."
      suggested_queries:
        - "Should trees have standing Christopher Stone summary"
        - "Whanganui river legal personhood property rights"
        - "indigenous stewardship vs western property law"
      requirements: >-
        Presentare la 'legal personhood' della natura non come una poetica metafora, 
        ma come una dottrina giuridica e filosofica reale e operativa, citando casi concreti.

    # -----------------------------------------------------------------------
    # Giorno 10 — Marx: proprietà e lavoro
    # -----------------------------------------------------------------------
    - day: 10
      title: "Marx: proprietà e lavoro"
      fundamental_question: "Che cosa distingue la proprietà personale dalla proprietà privata dei mezzi di produzione?"
      why_it_matters: >-
        "Proprietà privata" ha significati diversi. Marx critica una cosa
        specifica: la proprietà privata dei mezzi di produzione, non il possesso
        personale di ciò che serve alla vita.
      objectives:
        - Distinguere proprietà personale, proprietà privata dei mezzi di produzione, possesso, lavoro, capitale.
        - Introdurre la critica marxiana alla proprietà capitalistica.
        - Evitare la caricatura "Marx è contro ogni proprietà".
      concepts:
        - personal property
        - private property of means of production
        - possession
        - labour
        - capital
        - wage labour
      authors:
        - Karl Marx
      known_primary_sources:
        - author: "Karl Marx"
          title: "Capital, Volume I"
          location: "Ch. VI, 'The Buying and Selling of Labour-Power'"
          url: "https://www.marxists.org/archive/marx/works/1867-c1/ch06.htm"
          note: "Marxists Internet Archive, testo HTML completo."
      known_secondary_sources:
        - author: "Matt Vidal, Jean-Nicolas Beaudry, Vincent Guibert"
          title: "Karl Marx, Stanford Encyclopedia of Philosophy"
          url: "https://plato.stanford.edu/entries/marx/"
          note: ""
      suggested_queries:
        - "Marx private property means of production critique"
        - "Marx Capital labour-power buying and selling"
        - "Marx property personal vs means of production"
      requirements: >-
        Non usare "proprietà privata" come fosse un concetto univoco. Distinguere
        i significati e indicare esattamente quale proprietà critica Marx.

    # -----------------------------------------------------------------------
    # Giorno 11 — Marx e l'alienazione
    # -----------------------------------------------------------------------
    - day: 11
      title: "Marx e l'alienazione"
      fundamental_question: "Perché l'operaio risulta separato dal prodotto e dal proprio lavoro?"
      why_it_matters: >-
        L'alienazione collega lavoro, proprietà e prodotto: l'operaio produce
        qualcosa che non gli appartiene e che si contrappone a lui. È una tesi
        normativa, non solo descrittiva.
      objectives:
        - Leggere Marx sui Manoscritti economico-filosofici (1844) o su Il Capitale.
        - Collegare lavoro, prodotto, proprietà e alienazione.
        - Distinguere la tesi di Marx dalle sue interpretazioni.
      concepts:
        - alienation
        - estranged labour
        - product
        - species-being
      authors:
        - Karl Marx
      known_primary_sources:
        - author: "Karl Marx"
          title: "Economic and Philosophic Manuscripts of 1844"
          location: "Third Manuscript, 'Estranged Labour'"
          url: "https://www.marxists.org/archive/marx/works/1844/economic-philosophic-manuscripts/"
          note: "URL da verificare: se la pagina non è raggiungibile, dichiarare la fonte senza citazione esatta."
      known_secondary_sources:
        - author: "Matt Vidal, Jean-Nicolas Beaudry, Vincent Guibert"
          title: "Karl Marx, Stanford Encyclopedia of Philosophy"
          url: "https://plato.stanford.edu/entries/marx/"
          note: "Sezione sull'alienazione."
      suggested_queries:
        - "Marx estranged labour 1844 Estranged Labour full text"
        - "Marx alienation product labour property"
        - "Marx Economic and Philosophic Manuscripts estranged labour text"
      requirements: >-
        Se il testo primario non è recuperabile, dichiararlo esplicitamente e
        NON inventare una citazione. Usare fonti secondarie per l'interpretazione.

    # -----------------------------------------------------------------------
    # Giorno 12 — Marx: appropriazione e sfruttamento
    # -----------------------------------------------------------------------
    - day: 12
      title: "Marx: appropriazione e sfruttamento"
      fundamental_question: "Il fatto che qualcuno possieda un mezzo di produzione genera necessariamente sfruttamento?"
      why_it_matters: >-
        La tesi di Marx non è solo che i ricchi sono ricchi: è che il rapporto di
        proprietà produce un trasferimento sistematico di valore. Va esposta, e
        vanno prese sul serio le obiezioni.
      objectives:
        - Ricostruire l'argomento del plusvalore e dello sfruttamento.
        - Presentare le obiezioni principali (e.g. basate su rischio, funzione dell'imprenditore, contrattualismo).
        - Lasciare aperto il dibattito.
      concepts:
        - surplus value
        - exploitation
        - means of production
        - wage
        - extraction
      authors:
        - Karl Marx
      known_primary_sources:
        - author: "Karl Marx"
          title: "Capital, Volume I"
          location: "Ch. VI, 'The Buying and Selling of Labour-Power'; Ch. XIV 'Division of Labour'"
          url: "https://www.marxists.org/archive/marx/works/1867-c1/ch06.htm"
          note: "Testo HTML completo."
      known_secondary_sources:
        - author: "Matt Vidal, Jean-Nicolas Beaudry, Vincent Guibert"
          title: "Karl Marx, Stanford Encyclopedia of Philosophy"
          url: "https://plato.stanford.edu/entries/marx/"
          note: ""
      suggested_queries:
        - "Marx surplus value exploitation argument"
        - "Marx theory of exploitation capitalism objections"
        - "does private property of means of production imply exploitation"
      requirements: >-
        Presentare l'argomento marxiano nella forma più forte e le obiezioni nella
        forma più forte. Non risolvere il dibattito.

    # -----------------------------------------------------------------------
    # Giorno 13 — Il problema del valore
    # -----------------------------------------------------------------------
    - day: 13
      title: "Il problema del valore"
      fundamental_question: "Da dove deriva il valore economico di una cosa?"
      why_it_matters: >-
        La teoria del valore è il retroterra filosofico della disputa: quanto
        contribuisce il lavoro, quanto l'utilità, quanto la scarsità? La lezione
        non è un corso di economia: chiarisce il problema filosofico.
      objectives:
        - Confrontare lavoro, utilità, scarsità, preferenze e mercato come fonti del valore.
        - Mostrare che le teorie della proprietà presuppongono una risposta sulla genesi del valore.
        - Indicare punti di accordo e disaccordo.
      concepts:
        - labour theory of value
        - utility
        - scarcity
        - preferences
        - market
      authors:
        - Karl Marx
        - Adam Smith
        - David Ricardo
      known_primary_sources:
        - author: "Karl Marx"
          title: "Capital, Volume I"
          location: "Ch. I, 'Commodities'"
          url: "https://www.marxists.org/archive/marx/works/1867-c1/ch01.htm"
          note: ""
      known_secondary_sources:
        - author: "Matt Vidal, Jean-Nicolas Beaudry, Vincent Guibert"
