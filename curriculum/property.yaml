      why_it_matters: >-
        L'eredità connette la legittimità della proprietà con la disuguaglianza
        intergenerazionale. È un terreno su cui libertari ed egualitari si
        trovano vicini e lontani allo stesso tempo.
      objectives:
        - Confrontare argomenti a favore (libertà di trasferimento, cura familiare) e contro (merito, eguale cittadinanza, Nozick vs. Rawls).
        - Vedere come l'eredità interagisca con la tassazione.
