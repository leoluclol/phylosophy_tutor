        - "Nozick inheritance Rawls family justice"
        - "inheritance and equal opportunity Rawls"
      requirements: >-
        Nessuna delle due parti deve apparire vincente. Distinguere
        trasferimento volontario e trasferimento ereditario.

    # -----------------------------------------------------------------------
